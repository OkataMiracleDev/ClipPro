# ClipPro CI: the installed Visual Studio, LLVM and CMake on GitHub's Windows runner, FFmpeg
# from scripts/bootstrap.ps1, the mini test corpus, then scripts/verify.ps1. AI tests skip
# (no models are downloaded here); GPU decoding falls back to the CPU on the runner.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci

      - name: FFmpeg, UI dependencies and pyaaf2
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -Only ffmpeg,npm,pyaaf2

      - name: Doctor
        shell: pwsh
        run: ./scripts/doctor.ps1

      - name: Mini corpus
        shell: bash
        run: |
          source scripts/env.sh
          cargo build --release -p clippro-testgen
          ./target/release/clippro-testgen.exe --out testdata/gen --mini

      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1
