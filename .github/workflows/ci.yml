# ClipPro CI (PLAN P0.3): bootstrap the portable toolchain, generate the mini corpus, run
# scripts/verify.ps1, and upload the installer. Needs a GitHub remote (HC-1).
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache portable toolchain
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('scripts/bootstrap.ps1') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Bootstrap
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -AcceptMsvcLicense

      - name: Doctor
        shell: pwsh
        run: ./scripts/doctor.ps1

      - name: Mini corpus
        shell: bash
        run: |
          source scripts/env.sh
          cargo build --release -p clippro-testgen
          ./target/release/clippro-testgen.exe --out testdata/gen --mini

      - name: Verify
        shell: pwsh
        # GPU-dependent checks report and skip on the runner's software adapter; AI tests skip
        # without models (they aren't downloaded in CI).
        run: ./scripts/verify.ps1

      - name: Installer
        shell: bash
        run: |
          source scripts/env.sh
          cd app && ./ui/node_modules/.bin/tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ClipPro-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
