# Builds the Windows installer, signs the update and puts everything in a DRAFT release.
#
# Never runs on a normal push. Start it with release.bat (option 1) or
#     .\release.ps1 new 1.2.0 "What changed"
# or on GitHub: Actions > Release > Run workflow.
#
# Users and okata.space only see it once you publish the draft (release.bat option 3).
# See RELEASING.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.0 (must be higher than the last release)"
        required: true
      notes:
        description: "Release notes in Markdown (the app shows them in its update message)"
        required: false
        default: ""
      prerelease:
        description: "Pre-release (testers only: the app and the website don't offer it)"
        type: boolean
        default: false

permissions:
  contents: write   # create the release and its tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Releases come from main only (release.ps1 fast-forwards main and starts the build there).
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and the signing key
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.0, got '$env:VERSION'." }
          if ($env:HAS_KEY -ne 'true') { throw "The TAURI_SIGNING_PRIVATE_KEY secret is missing. See RELEASING.md (one-time setup)." }
          gh release view "v$env:VERSION" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "v$env:VERSION already exists. Pick a higher version." }
          $global:LASTEXITCODE = 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # cl.exe, link.exe, rc.exe and the Windows SDK on PATH for every later step.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: FFmpeg and UI dependencies
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -Only ffmpeg,npm

      - name: Set the version
        shell: pwsh
        run: python scripts/set_version.py "${{ inputs.version }}"

      - name: Build the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          source scripts/env.sh
          cd app
          ./ui/node_modules/.bin/tauri build

      - name: Package the release
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          $nsis = "target/release/bundle/nsis"
          $exe = "$nsis/ClipPro_$($env:VERSION)_x64-setup.exe"
          if (-not (Test-Path "$exe.sig")) { throw "The installer wasn't signed for updates ($exe.sig missing)." }
          $notes = if ($env:NOTES) { $env:NOTES } else { "ClipPro $env:VERSION" }
          # A file, not an argument: full notes keep their quotes and lines.
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/notes.md", $notes)
          python scripts/latest_json.py $env:VERSION $exe "$env:RUNNER_TEMP/notes.md" "$nsis/latest.json" "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "latest.json failed." }
          ./scripts/package-portable.ps1
          # Fixed names too, so https://github.com/<repo>/releases/latest/download/ClipPro-setup-x64.exe
          # always gives the newest version (the website's download button uses it).
          Copy-Item $exe "$nsis/ClipPro-setup-x64.exe"
          Copy-Item "target/release/bundle/portable/ClipPro_$($env:VERSION)_x64-portable.zip" "target/release/bundle/portable/ClipPro-portable-x64.zip"

      - name: Create the draft release
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $nsis = "target/release/bundle/nsis"
          $portable = "target/release/bundle/portable"
          $flags = @("--draft")
          if ($env:PRERELEASE -eq "true") { $flags += "--prerelease" }
          gh release create "v$env:VERSION" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "ClipPro $env:VERSION" --notes-file "$env:RUNNER_TEMP/notes.md" @flags `
            "$nsis/ClipPro_$($env:VERSION)_x64-setup.exe" `
            "$nsis/ClipPro_$($env:VERSION)_x64-setup.exe.sig" `
            "$nsis/ClipPro-setup-x64.exe" `
            "$nsis/latest.json" `
            "$portable/ClipPro_$($env:VERSION)_x64-portable.zip" `
            "$portable/ClipPro-portable-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw "Creating the release failed." }
