[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Miracle Okata"]
license = "LicenseRef-MIT-Commons-Clause"
publish = false
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

# Build scripts run optimised: ffmpeg-sys's bindgen pass overflows the 1 MB Windows main-thread
# stack when compiled at opt-level 0 alongside Tauri's dependency features.
[profile.release.build-override]
opt-level = 3
