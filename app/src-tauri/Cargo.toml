[package]
name = "clippro-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "ClipPro desktop app"

[lints]
workspace = true

[lib]
name = "clippro_app"
crate-type = ["rlib"]

[[bin]]
name = "ClipPro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
clippro-analysis = { path = "../../crates/clippro-analysis" }
clippro-core = { path = "../../crates/clippro-core" }
clippro-measure = { path = "../../crates/clippro-measure" }
clippro-project = { path = "../../crates/clippro-project" }
clippro-score = { path = "../../crates/clippro-score", features = ["specta"] }
clippro-types = { path = "../../crates/clippro-types", features = ["specta"] }
serde = { version = "1.0.229", features = ["derive"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
clippro-media = { path = "../../crates/clippro-media" }
clippro-ai = { path = "../../crates/clippro-ai" }
clippro-transcribe = { path = "../../crates/clippro-transcribe" }
serde_json = "1.0.154"
specta-typescript = "=0.0.13"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
window-vibrancy = "0.8"
jpeg-encoder = { version = "0.6", features = ["simd"] }
cpal = "0.18.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62"
clippro-interchange = { path = "../../crates/clippro-interchange" }
clippro-ingest = { path = "../../crates/clippro-ingest" }
