[package]
name = "clippro-score"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }
clippro-types = { path = "../clippro-types" }
clippro-measure = { path = "../clippro-measure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
schemars = "1"
thiserror = "2"
rayon = "1"

[dev-dependencies]
proptest = "1"
criterion = "0.7"

[[bench]]
name = "rescore"
harness = false

[features]
specta = ["dep:specta", "clippro-types/specta"]
