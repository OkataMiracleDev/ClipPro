[preset]
name = "Action / Sport"
version = 1
description = "Chases movement and energy."

[thresholds]
score = [0.5, 1.0]
segment_length = ["1s", "20s"]
max_per_clip = "none"

[weights]
focus = 30.0
exposure = 20.0
motion = 50.0
audio = 0.0
content = 0.0

[motion]
camera_motion = 0.6
subject_motion = 0.8
motion_stability = 0.2

[flags]
motion_blur = "neutral"
shaky = "neutral"

[camera_filter]
enabled = false
static_only = false
mirror = false
radius = 0.0
direction = 0.0
zoom = 0.0
rotate = 0.0

[advanced]
gap_tolerance = "0.5s"
centre_weighting = 0.3
stability_emphasis = 0.1
handles_samples = 3
snap_to_sentences = false
long_segment_mode = "split"
