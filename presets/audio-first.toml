[preset]
name = "Audio-First"
version = 1
description = "Podcasts and vlogs: clean, present speech matters most."

[thresholds]
score = [0.5, 1.0]
segment_length = ["3s", "none"]
max_per_clip = "none"

[weights]
focus = 15.0
exposure = 15.0
motion = 10.0
audio = 60.0
content = 0.0

[audio]
speech_presence = 1.0
clean = 1.0
wind = -0.8
hum = -0.8
loudness = { enabled = true, target = -16.0, tolerance = 8.0 }

[flags]
audio_clipping = "disfavour"
silence = "force_exclude"

[camera_filter]
enabled = false
static_only = false
mirror = false
radius = 0.0
direction = 0.0
zoom = 0.0
rotate = 0.0

[advanced]
gap_tolerance = "0.75s"
centre_weighting = 0.2
stability_emphasis = 0.4
handles_samples = 3
snap_to_sentences = true
long_segment_mode = "split"
