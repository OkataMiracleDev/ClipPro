[preset]
name = "Drone / Aerial"
version = 1
description = "Favours smooth, sharp gimbal and drone footage."

[thresholds]
score = [0.6, 1.0]
segment_length = ["4s", "none"]
max_per_clip = "none"

[weights]
focus = 40.0
exposure = 30.0
motion = 30.0
audio = 0.0
content = 0.0

[focus]
sharpness = 0.9

[exposure]
flicker = -0.6

[motion]
motion_stability = 1.0
camera_motion = 0.3

[flags]
shaky = "force_exclude"
motion_blur = "force_exclude"

[camera_filter]
enabled = false
static_only = false
mirror = false
radius = 0.0
direction = 0.0
zoom = 0.0
rotate = 0.0

[advanced]
gap_tolerance = "1s"
centre_weighting = 0.0
stability_emphasis = 0.9
handles_samples = 3
snap_to_sentences = false
long_segment_mode = "split"
